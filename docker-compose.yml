version: '3.8'

services:
  polybot:
    build: .
    container_name: polybot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # ── WALLET ────────────────────────────────────────────────────
      - PRIVATE_KEY=0x
      - DEPOSIT_WALLET_ADDRESS=0x
      - SIGNATURE_TYPE=3

      # ── MODE ──────────────────────────────────────────────────────
      # Set PRODUCTION=true only after validating with 100+ simulated bets
      - PRODUCTION=false
      - SHARES_PER_BET=2

      # ── STRATEGY ──────────────────────────────────────────────────
      - ACTIVE_STRATEGY=watch_120_bet_90
      - WATCH_SECOND=120
      - BET_SECOND=90
      - PRICE_MIN=0.85
      - PRICE_MAX=0.96
      - BET_PRICE_MAX=0.98

      # ── APIS ──────────────────────────────────────────────────────
      - GAMMA_API_URL=https://gamma-api.polymarket.com
      - CLOB_API_URL=https://clob.polymarket.com
      - RPC_URL=https://polygon-bor-rpc.publicnode.com

      # ── TIMING ────────────────────────────────────────────────────
      - POLL_INTERVAL_MS=1000

      # ── DASHBOARD ─────────────────────────────────────────────────
      # 0.0.0.0 is required inside Docker — do not change to 127.0.0.1
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080

      # ── PATHS ─────────────────────────────────────────────────────
      - TRADES_CSV=data/trades.csv
      - LOG_FILE=logs/bot.log
